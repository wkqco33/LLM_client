name: Feature Request
description: 새로운 기능을 제안해 주세요.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 동기 / 배경
      description: 어떤 문제를 해결하려고 하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 추가했으면 하는 기능과 동작 방식을 알려주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 이미 고려해본 대안이나 우회 방법이 있나요?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 참고 / 추가 내용
    validations:
      required: false
